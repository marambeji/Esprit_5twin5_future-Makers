name: Laravel CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate temporary test application key
        run: php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' >> "$GITHUB_ENV"

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: |
          find app bootstrap config database public routes tests -type f -name '*.php' \
            ! -path 'bootstrap/cache/*' -print0 | xargs -0 -r -n1 php -l
          php -l artisan

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^!"
          fi

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify isolated PHPUnit database
        run: |
          php -r '
          $config = simplexml_load_file("phpunit.xml");
          $values = [];
          foreach ($config->php->env as $entry) {
              $values[(string) $entry["name"]] = (string) $entry["value"];
          }
          if (($values["DB_CONNECTION"] ?? null) !== "sqlite" || ($values["DB_DATABASE"] ?? null) !== ":memory:") {
              fwrite(STDERR, "PHPUnit must use in-memory SQLite.\n");
              exit(1);
          }
          echo "PHPUnit uses isolated in-memory SQLite.\n";
          '

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test --compact

      - name: Validate Docker image build
        run: docker build --tag nutritrace-ci:${GITHUB_SHA} .
